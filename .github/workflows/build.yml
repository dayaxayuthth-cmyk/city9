name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unzip project
        run: unzip -q City9Android_ReadyToBuild.zip
      - name: Download Three.js
        working-directory: City9Android
        run: |
          curl -fL https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js -o app/src/main/assets/three.min.js
          test $(stat -c%s app/src/main/assets/three.min.js) -gt 100000
      - name: Build debug APK
        working-directory: City9Android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: City9-APK
          path: City9Android/app/build/outputs/apk/debug/app-debug.apk
